<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Web Crawler | Calvins Geek</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --dark:#0a0a0f;--dark2:#12121a;
  --white:#f5f5f7;--gray:#888899;
  --cyan:#00d4ff;--green:#00ff88;--purple:#b24bff;
  --orange:#ff6b35;--pink:#ff3d7f;--blue:#4070ff;
}
body{
  font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);
  min-height:100vh;padding:60px 20px;line-height:1.6;
  background-image:
    radial-gradient(circle at 20% 0%,rgba(0,212,255,.06),transparent 50%),
    radial-gradient(circle at 80% 100%,rgba(178,75,255,.06),transparent 50%);
}
.container{max-width:900px;margin:0 auto;}
.back{display:inline-block;color:var(--gray);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color .2s;}
.back:hover{color:var(--cyan);}
header{text-align:center;margin-bottom:48px;}
h1{
  font-family:'Syne',sans-serif;font-size:clamp(36px,6vw,64px);
  font-weight:800;letter-spacing:-2px;margin-bottom:12px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
header p{color:var(--gray);font-size:16px;}
form{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
input{
  flex:1;min-width:240px;padding:16px 20px;border-radius:12px;
  background:var(--dark2);border:1px solid rgba(255,255,255,.08);
  color:var(--white);font-size:15px;font-family:inherit;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.1);}
input::placeholder{color:rgba(255,255,255,.25);}
button{
  padding:16px 32px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  color:var(--dark);font-size:15px;font-weight:600;font-family:inherit;
  transition:transform .2s,box-shadow .2s;
}
button:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,212,255,.35);}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
.examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;}
.examples button{
  padding:6px 14px;font-size:12px;background:rgba(255,255,255,.04);
  color:var(--gray);border:1px solid rgba(255,255,255,.08);border-radius:100px;
}
.examples button:hover{color:var(--cyan);border-color:rgba(0,212,255,.3);transform:none;box-shadow:none;}
#status{text-align:center;font-size:14px;color:var(--gray);margin-bottom:24px;min-height:20px;font-weight:500;}
.card{
  background:var(--dark2);border:1px solid rgba(255,255,255,.06);
  border-radius:16px;padding:28px;margin-bottom:16px;position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
}
.card h2{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:10px;word-break:break-word;}
.card h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:16px;color:var(--cyan);}
.card p.desc{color:var(--gray);font-size:14px;line-height:1.7;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px;}
.stat{background:var(--dark2);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px;text-align:center;}
.stat .n{
  font-family:'Syne',sans-serif;font-size:28px;font-weight:800;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.stat .l{font-size:11px;color:var(--gray);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
.card ul{list-style:none;}
.card li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px;color:var(--gray);word-break:break-word;}
.card li:last-child{border-bottom:none;}
.card li strong{color:var(--orange);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;margin-right:8px;letter-spacing:1px;}
.placeholder{text-align:center;color:var(--gray);padding:60px 20px;font-size:14px;}
.placeholder .emoji{font-size:48px;display:block;margin-bottom:16px;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back">← Back to Portfolio</a>

  <header>
    <h1>Web Crawler 🕷️</h1>
    <p>Paste any URL — I'll crawl it and show you what's inside.</p>
  </header>

  <form id="crawl-form">
    <input type="text" id="url-input" placeholder="example.com" autocomplete="off" spellcheck="false"/>
    <button type="submit" id="crawl-btn">Crawl</button>
  </form>

  <div class="examples">
    <button type="button" data-url="example.com">example.com</button>
    <button type="button" data-url="wikipedia.org">wikipedia.org</button>
    <button type="button" data-url="developer.mozilla.org">MDN</button>
    <button type="button" data-url="news.ycombinator.com">Hacker News</button>
  </div>

  <div id="status"></div>
  <div id="results">
    <div class="placeholder">
      <span class="emoji">🌐</span>
      Enter a URL above to start crawling
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var form = document.getElementById('crawl-form');
  var input = document.getElementById('url-input');
  var btn = document.getElementById('crawl-btn');
  var status = document.getElementById('status');
  var results = document.getElementById('results');

  document.querySelectorAll('.examples button').forEach(function(b){
    b.addEventListener('click', function(){
      input.value = b.dataset.url;
      form.dispatchEvent(new Event('submit'));
    });
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();

    var url = input.value.trim();
    if(!url) return;
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

    btn.disabled = true;
    status.innerHTML = '<span class="spin">🕷️</span> Crawling...';
    status.style.color = 'var(--cyan)';
    results.innerHTML = '';

    // Try multiple proxies — first one that works wins
    var proxies = [
      'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
      'https://corsproxy.io/?' + encodeURIComponent(url),
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
    ];

    var html = null;
    var lastError = '';

    for(var i = 0; i < proxies.length; i++){
      try{
        status.innerHTML = '<span class="spin">🕷️</span> Crawling... (attempt ' + (i+1) + '/' + proxies.length + ')';
        var res = await fetch(proxies[i]);
        if(res.ok){
          html = await res.text();
          if(html && html.length > 50) break;
        } else {
          lastError = 'Proxy ' + (i+1) + ' returned ' + res.status;
        }
      }catch(err){
        lastError = err.message;
      }
    }

    if(!html){
      status.textContent = '❌ All proxies failed. Try another URL.';
      status.style.color = 'var(--orange)';
      results.innerHTML = '<div class="placeholder"><span class="emoji">😬</span>' +
        escapeHtml(lastError || 'Could not reach that site') +
        '<br><br>Try a simpler site like <strong>example.com</strong></div>';
      btn.disabled = false;
      return;
    }

    try{
      var doc = new DOMParser().parseFromString(html, 'text/html');

      var titleEl = doc.querySelector('title');
      var title = titleEl ? titleEl.textContent.trim() : 'No title';

      var descEl = doc.querySelector('meta[name="description"]');
      var description = descEl ? descEl.getAttribute('content') : 'No description';

      var headings = [];
      doc.querySelectorAll('h1,h2,h3').forEach(function(h){
        var t = h.textContent.trim().slice(0,120);
        if(t) headings.push({level: h.tagName, text: t});
      });

      var links = doc.querySelectorAll('a[href]');
      var internal = 0, external = 0;
      var targetHost = new URL(url).host;
      links.forEach(function(a){
        try{
          var abs = new URL(a.getAttribute('href'), url).href;
          var host = new URL(abs).host;
          if(host === targetHost) internal++; else external++;
        }catch(e){}
      });

      var images = doc.querySelectorAll('img');
      var missingAlt = 0;
      images.forEach(function(img){
        if(!img.getAttribute('alt') || !img.getAttribute('alt').trim()) missingAlt++;
      });

      var bodyText = doc.body ? doc.body.textContent.replace(/\s+/g,' ').trim() : '';
      var wordCount = bodyText ? bodyText.split(' ').length : 0;

      status.textContent = '✅ Crawl complete';
      status.style.color = 'var(--green)';

      var headingsHtml = headings.length
        ? headings.slice(0,15).map(function(h){
            return '<li><strong>' + h.level + '</strong> ' + escapeHtml(h.text) + '</li>';
          }).join('')
        : '<li>No headings found</li>';

      results.innerHTML =
        '<div class="card">' +
          '<h2>' + escapeHtml(title) + '</h2>' +
          '<p class="desc">' + escapeHtml(description) + '</p>' +
        '</div>' +
        '<div class="grid">' +
          '<div class="stat"><div class="n">' + wordCount.toLocaleString() + '</div><div class="l">Words</div></div>' +
          '<div class="stat"><div class="n">' + links.length + '</div><div class="l">Links</div></div>' +
          '<div class="stat"><div class="n">' + internal + '</div><div class="l">Internal</div></div>' +
          '<div class="stat"><div class="n">' + external + '</div><div class="l">External</div></div>' +
          '<div class="stat"><div class="n">' + images.length + '</div><div class="l">Images</div></div>' +
          '<div class="stat"><div class="n">' + missingAlt + '</div><div class="l">Missing Alt</div></div>' +
        '</div>' +
        '<div class="card">' +
          '<h3>Headings (' + headings.length + ')</h3>' +
          '<ul>' + headingsHtml + '</ul>' +
        '</div>';

    }catch(err){
      status.textContent = '❌ ' + err.message;
      status.style.color = 'var(--orange)';
    }finally{
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
